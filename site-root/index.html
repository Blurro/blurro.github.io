<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#090a0e">
    <meta name="description" content="Blurro - software, tools and experiments.">
    <title>Blurro</title>
    <style>
      :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;color:#b9bbc7;background:#090a0e;--blue:#6268ff;--bright:#8b94ff;--mono:Consolas,'Liberation Mono',monospace}
      *{box-sizing:border-box}body{margin:0;min-height:100svh;isolation:isolate}
      body::before{content:'';position:fixed;inset:0;z-index:-2;background:#090a0e url('/assets/abstract-bg.svg') center/cover no-repeat;pointer-events:none}
      body::after{content:'';position:fixed;inset:0;z-index:-1;opacity:.23;background:repeating-linear-gradient(0deg,transparent 0 3px,#0005 3px 4px);pointer-events:none}
      a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid #aeb6ff;outline-offset:7px}::selection{color:#fff;background:#4f50c5}
      .page{min-height:100svh;display:flex;flex-direction:column;padding:28px 42px 22px}
      .topbar,.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;font-family:var(--mono);font-size:10px;letter-spacing:.14em}
      .site-label{display:flex;align-items:center;gap:11px;color:#9699ae}.site-label::before{content:'';width:6px;height:6px;background:var(--blue);box-shadow:0 0 13px #6368ff88}.topbar>span:last-child{color:#565965;font-size:9px}
      main{flex:1;display:grid;place-items:center;padding:65px 0 80px}.identity{width:min(100%,862px);position:relative;text-align:center;padding:50px 38px 40px}
      .identity::before,.identity::after{content:'';position:absolute;pointer-events:none;width:58px;height:58px;border-color:#6268ff99;border-style:solid}.identity::before{inset:0 auto auto 0;border-width:1px 0 0 1px}.identity::after{inset:auto 0 0 auto;border-width:0 1px 1px 0}
      .eyebrow{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 42px;font:9px var(--mono);color:#72768e;letter-spacing:.2em}.eyebrow::before,.eyebrow::after{content:'';width:30px;height:1px;background:#525bc46b}
      h1{margin:0;font-size:0;line-height:0}.logo{display:block;width:688px;height:136px;margin-inline:auto;image-rendering:crisp-edges;image-rendering:pixelated}
      .divider{display:flex;align-items:center;gap:8px;width:min(100%,390px);margin:35px auto 29px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#4f56b8)}.divider::after{transform:rotate(180deg)}.divider span{width:4px;height:4px;transform:rotate(45deg);background:var(--blue)}
      .tagline{margin:0;color:#b2b4c2;font:10px/1.8 var(--mono);letter-spacing:.25em}.intro{margin:17px auto 0;max-width:360px;color:#797d91;font-size:13px;line-height:1.9}
      .links{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:31px}.link{min-width:156px;display:inline-flex;align-items:center;justify-content:space-between;gap:30px;padding:13px 17px;background:#11121be0;border:1px solid #373a60;color:#bfc3e1;font:11px var(--mono);transition:border-color .18s,background .18s,color .18s}.link-primary{border-color:#575eda;background:#202345b8;color:#e4e5ff}.link:hover{border-color:#8b94ff;background:#25294bbb;color:#fff}.link svg{width:14px;height:14px;color:var(--bright)}
      .footer{color:#515564;font-size:8px;letter-spacing:.12em;border-top:1px solid #272a3a;padding-top:18px}.footer>span:last-child{display:flex;align-items:center;gap:9px}.footer>span:last-child::before{content:'';height:1px;width:27px;background:#656ce9}
      @media(max-width:880px){.page{padding:25px 28px 22px}.identity{padding:44px 20px 34px}.logo{width:516px;height:102px}}
      @media(max-width:620px){.page{padding:22px 20px 18px}.topbar{font-size:8px;letter-spacing:.1em}.topbar>span:last-child{font-size:7px}main{padding:62px 0 65px}.identity{padding:38px 0 32px}.identity::before,.identity::after{width:27px;height:27px}.logo{width:344px;height:68px}.eyebrow{font-size:8px;gap:9px;letter-spacing:.12em;margin-bottom:37px}.eyebrow::before,.eyebrow::after{width:20px}.divider{width:260px;margin-block:30px 25px}.tagline{font-size:8px;letter-spacing:.15em}.intro{font-size:12px;max-width:290px;margin-top:15px}.links{gap:10px;margin-top:26px}.link{min-width:140px;padding:13px 14px;gap:20px;font-size:10px}.footer{font-size:7px}}
      @media(max-width:390px){.logo{width:258px;height:51px}.topbar>span:last-child{display:none}.eyebrow{font-size:7px}.tagline{font-size:7px}.link{min-width:128px}}
      @media(prefers-reduced-motion:reduce){.link{transition:none}}
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar"><span class="site-label">BLURRO.GITHUB.IO</span><span>PERSONAL SPACE / 01</span></header>
      <main>
        <section class="identity" aria-labelledby="name">
          <p class="eyebrow">SOMETHING TO TINKER WITH</p>
          <h1 id="name"><picture><source media="(prefers-reduced-motion: reduce)" srcset="/assets/blurro-logo-still.png"><img class="logo" src="/assets/blurro-logo.gif" alt="Blurro" width="86" height="17" fetchpriority="high"></picture></h1>
          <div class="divider" aria-hidden="true"><span></span><span></span><span></span></div>
          <p class="tagline">SOFTWARE / TOOLS / EXPERIMENTS</p>
          <p class="intro">Usually taking something apart.<br>Sometimes building something out of it.</p>
          <nav class="links" aria-label="Find Blurro online">
            <a class="link link-primary" href="https://github.com/Blurro">GitHub<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg></a>
            <a class="link" href="https://gamebanana.com/members/1672097">GameBanana<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg></a>
          </nav>
        </section>
      </main>
      <footer class="footer"><span>BLURRO / PERSONAL PROJECTS</span><span>KEEP EXPLORING</span></footer>
    </div>
  </body>
</html>
