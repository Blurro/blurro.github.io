<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#090a0e">
    <title>Blurro</title>
    <style>
      :root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif;color:#b9bbc7;background:#090a0e;--blue:#6268ff;--bright:#8b94ff;--mono:Consolas,'Liberation Mono',monospace}
      *{box-sizing:border-box}body{margin:0;min-height:100svh;isolation:isolate}
      body::before{content:'';position:fixed;inset:0;z-index:-2;background:#090a0e url('/assets/abstract-bg.svg') center/cover no-repeat;pointer-events:none}
      body::after{content:'';position:fixed;inset:0;z-index:-1;opacity:.23;background:repeating-linear-gradient(0deg,transparent 0 3px,#0005 3px 4px);pointer-events:none}
      a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid #aeb6ff;outline-offset:7px}::selection{color:#fff;background:#4f50c5}
      main{min-height:100svh;display:grid;place-items:center;padding:40px 42px}
      .identity{width:min(100%,862px);position:relative;text-align:center;padding:70px 38px 55px}
      .identity::before,.identity::after{content:'';position:absolute;pointer-events:none;width:58px;height:58px;border-color:#6268ff99;border-style:solid}.identity::before{inset:0 auto auto 0;border-width:1px 0 0 1px}.identity::after{inset:auto 0 0 auto;border-width:0 1px 1px 0}
      h1{margin:0;font-size:0;line-height:0;-webkit-user-select:none;user-select:none}.logo{display:block;width:688px;height:136px;margin-inline:auto;image-rendering:crisp-edges;image-rendering:pixelated;-webkit-user-drag:none;pointer-events:none}
      .divider{display:flex;align-items:center;gap:8px;width:min(100%,390px);margin:35px auto 29px}.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,#4f56b8)}.divider::after{transform:rotate(180deg)}.divider span{width:4px;height:4px;transform:rotate(45deg);background:var(--blue)}
      .links{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px}.link{min-width:156px;display:inline-flex;align-items:center;justify-content:space-between;gap:30px;padding:13px 17px;background:#11121be0;border:1px solid #373a60;color:#bfc3e1;font:11px var(--mono);transition:border-color .18s,background .18s,color .18s}.link-primary{border-color:#575eda;background:#202345b8;color:#e4e5ff}.link:hover{border-color:#8b94ff;background:#25294bbb;color:#fff}.link svg{width:14px;height:14px;color:var(--bright)}
      @media(max-width:880px){main{padding:30px 28px}.identity{padding:60px 20px 45px}.logo{width:516px;height:102px}}
      @media(max-width:620px){main{padding:30px 20px}.identity{padding:45px 0 35px}.identity::before,.identity::after{width:27px;height:27px}.logo{width:344px;height:68px}.divider{width:260px;margin-block:30px 25px}.links{gap:10px}.link{min-width:140px;padding:13px 14px;gap:20px;font-size:10px}}
      @media(max-width:390px){.logo{width:258px;height:51px}.link{min-width:128px}}
      @media(prefers-reduced-motion:reduce){.link{transition:none}}
    </style>
  </head>
  <body>
    <main>
      <section class="identity" aria-labelledby="name">
        <h1 id="name"><picture><source media="(prefers-reduced-motion: reduce)" srcset="/assets/blurro-logo-still.png"><img class="logo" draggable="false" src="/assets/blurro-logo.gif" alt="Blurro" width="86" height="17" fetchpriority="high"></picture></h1>
        <div class="divider" aria-hidden="true"><span></span><span></span><span></span></div>
        <nav class="links" aria-label="Profiles">
          <a class="link link-primary" href="https://github.com/Blurro">GitHub<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg></a>
          <a class="link" href="https://gamebanana.com/members/1672097">GameBanana<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 12 12 4M4 4h8v8"/></svg></a>
        </nav>
      </section>
    </main>
  </body>
</html>
