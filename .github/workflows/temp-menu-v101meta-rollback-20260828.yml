name: Temp MENU v1.01 metadata rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-menu-v101meta-rollback-20260828.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MENU metadata only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          menu = Path('sysplugins/online_dev/menu_r.bin')
          data = bytearray(menu.read_bytes())
          old_sha = hashlib.sha256(data).hexdigest()
          assert old_sha == '9b5c58c15c357835f4cc7ac718c23db2280e2897850e7d499170e69a3c04e73d', old_sha

          metadata = 0x8BF0
          assert data[metadata:metadata + 4] == b'3NXV'
          assert int.from_bytes(data[metadata + 4:metadata + 8], 'little') == 102
          assert data[metadata + 8:metadata + 12] == b'3NXO'
          assert int.from_bytes(data[metadata + 12:metadata + 16], 'little') == 101

          data[metadata + 4:metadata + 8] = (101).to_bytes(4, 'little')
          menu.write_bytes(data)
          new_sha = hashlib.sha256(data).hexdigest()
          assert new_sha == '794523756677105118722c3b6c9e5b6a9c1b23ec7506d84b82e5eb7dcb017c0a', new_sha

          packs = Path('sysplugins/online_dev/plgpacks.txt')
          text = packs.read_text()
          old = 'MENU00000066;https://blurro.github.io/sysplugins/online_dev/menu_r.bin'
          new = 'MENU00000065;https://blurro.github.io/sysplugins/online_dev/menu_r.bin'
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          packs.write_text(text)

          packs_sha = hashlib.sha256(packs.read_bytes()).hexdigest()
          assert packs_sha == '312f3022337875650e05ec22881bc6dd24b9277296d401ae81ef3d681bd4871c', packs_sha
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- sysplugins/online_dev/menu_r.bin sysplugins/online_dev/plgpacks.txt
          git commit -m 'Revert MENU metadata to v1.01'
          git push
