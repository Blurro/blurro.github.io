name: Remove retired personal-page build records

on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-old-pages-runs.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove retired build runs, logs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          const base = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const headers = {
            Authorization: `Bearer ${process.env.GH_TOKEN}`,
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };
          const retired = [];
          for (let page = 1; ; page++) {
            const response = await fetch(`${base}/actions/runs?per_page=100&page=${page}`, {headers});
            if (!response.ok) throw new Error(`Listing build records failed: ${response.status}`);
            const {workflow_runs: runs} = await response.json();
            retired.push(...runs.filter(run => run.name === 'Deploy portfolio and existing pages to GitHub Pages'));
            if (runs.length < 100) break;
          }
          for (const run of retired) {
            const response = await fetch(`${base}/actions/runs/${run.id}`, {method: 'DELETE', headers});
            if (response.status !== 204 && response.status !== 404) {
              throw new Error(`Removing a retired build record failed: ${response.status}`);
            }
          }
          console.log(`Removed ${retired.length} retired build records and their associated logs and artifacts.`);
          JS
