name: One-shot CTGP v1.02 metadata repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ctgp-v102-metadata.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and verify CTGP v1.02 payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          paths = [
              Path("sysplugins/online_v1/ctgp_r.bin"),
              Path("sysplugins/online_dev/ctgp_r.bin"),
          ]

          offset = 0xC550
          expected_old = bytes.fromhex("01 02 00 00 00")
          replacement  = bytes.fromhex("33 4E 58 56 66")
          expected_sha = "878dc4cf2f0ac4b223d9bbaa631d7c90c79f739b40629ff9d7504b2763579707"

          for path in paths:
              data = bytearray(path.read_bytes())
              if len(data) != 50528:
                  raise SystemExit(f"{path}: unexpected size {len(data)}")
              old = bytes(data[offset:offset+5])
              if old != expected_old:
                  raise SystemExit(f"{path}: unexpected old bytes at 0x{offset:X}: {old.hex()}")
              data[offset:offset+5] = replacement
              sha = hashlib.sha256(data).hexdigest()
              if sha != expected_sha:
                  raise SystemExit(f"{path}: SHA mismatch after patch: {sha}")
              # Full required metadata tail: 3NXV + LE u32 102 + zero padding to 16 bytes.
              if bytes(data[-16:]) != bytes.fromhex(
                  "33 4E 58 56 66 00 00 00 00 00 00 00 00 00 00 00"
              ):
                  raise SystemExit(f"{path}: invalid final metadata tail")
              path.write_bytes(data)
              print(f"{path}: fixed {sha}")
          PY

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sysplugins/online_v1/ctgp_r.bin sysplugins/online_dev/ctgp_r.bin
          git rm .github/workflows/fix-ctgp-v102-metadata.yml
          git commit -m 'Fix CTGP-7 v1.02 metadata header'
          git push
