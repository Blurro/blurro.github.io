name: Deploy iwantmelunsmelons to GitHub Pages

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: iwantmelunsmelons/package-lock.json

      - name: Install dependencies
        working-directory: iwantmelunsmelons
        run: npm ci

      - name: Build
        working-directory: iwantmelunsmelons
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/iwantmelunsmelons

          cp -a iwantmelunsmelons/dist/client/. _site/iwantmelunsmelons/

          mkdir -p _site/sysplugins/online_v1
          cp sysplugins/online_v1/onlineblurrotemporary.3on _site/sysplugins/online_v1/onlineblurrotemporary.3on

          if [ -f "_site/iwantmelunsmelons/_shell.html" ]; then
            cp "_site/iwantmelunsmelons/_shell.html" "_site/iwantmelunsmelons/index.html"
            cp "_site/iwantmelunsmelons/_shell.html" "_site/iwantmelunsmelons/404.html"
          elif [ -f "_site/iwantmelunsmelons/index.html" ]; then
            cp "_site/iwantmelunsmelons/index.html" "_site/iwantmelunsmelons/404.html"
          else
            echo "No _shell.html or index.html found"
            exit 1
          fi

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4